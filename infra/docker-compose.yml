name: slotflow
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: slotflow
      POSTGRES_PASSWORD: slotflow
      POSTGRES_DB: slotflow
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotflow -d slotflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # AWS emulator for SQS (queues, delays, dead letters) and SES (email). Pinned to 4.12, the last
  # release that needs no auth token; newer LocalStack images require LOCALSTACK_AUTH_TOKEN.
  # Sent mail can be inspected at http://localhost:4566/_aws/ses
  localstack:
    image: localstack/localstack:4.12.0
    environment:
      SERVICES: sqs,ses
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: applies SQL migrations and seeds fake clinic data as the admin (superuser) role.
  migrate:
    build: { context: .., dockerfile: infra/Dockerfile, target: api }
    command: ["sh", "-c", "node dist/migrate-cli.js && node dist/seed-cli.js"]
    environment:
      DATABASE_ADMIN_URL: postgres://slotflow:slotflow@postgres:5432/slotflow
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: .., dockerfile: infra/Dockerfile, target: api }
    environment:
      # Runs as the non-superuser role slotflow_app so Row Level Security is always enforced.
      DATABASE_URL: postgres://slotflow_app:slotflow_app@postgres:5432/slotflow
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      LLM_PROVIDER: mock
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: .., dockerfile: infra/Dockerfile, target: worker }
    environment:
      WORKER_DATABASE_URL: postgres://slotflow_worker:slotflow_worker@postgres:5432/slotflow
      REDIS_URL: redis://redis:6379
      AWS_ENDPOINT_URL: http://localstack:4566
      API_URL: http://api:3000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      localstack: { condition: service_healthy }

volumes:
  pgdata:
