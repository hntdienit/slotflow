name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      localstack:
        image: localstack/localstack:4.12.0
        env: { SERVICES: "sqs,ses" }
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -fs http://localhost:4566/_localstack/health" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slotflow/core --filter @slotflow/llm build && pnpm --filter @slotflow/api build
      # Next bakes the /api proxy target at build time; the E2E API listens on 3100.
      - run: API_URL=http://localhost:3100 pnpm --filter @slotflow/web build
      - run: pnpm --filter @slotflow/e2e e2e
        env: { CHROME_PATH: /usr/bin/google-chrome }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: e2e/test-results }
  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.yml build
